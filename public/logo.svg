<svg viewBox="0 0 500 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap');
      
      .borro-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 90px;
        font-weight: 900;
        fill: #000000;
        letter-spacing: -2px;
      }
      
      .logo-circle {
        fill: none;
        stroke: #000000;
        stroke-width: 5;
        stroke-linecap: round;
      }
    </style>
  </defs>
  
  <!-- Interlocking circles -->
  <circle cx="45" cy="60" r="28" class="logo-circle" />
  <circle cx="75" cy="60" r="28" class="logo-circle" />
  
  <!-- BORRO text -->
  <text x="130" y="95" class="borro-text">BORRO</text>
</svg>